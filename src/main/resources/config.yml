wait-seconds: 60

create-void-world: true
wait-location:
  world: deathwait_void
  x: 0.5
  y: 64
  z: 0.5

wait-gamemode: ADVENTURE
return-gamemode: SURVIVAL
fly-speed: 0.1

allowed-commands:
  - msg
  - tell
  - r

effects:
  lightning: true
  spawn-sound: true
  spawn-particles: true
  effect-on-return: true

